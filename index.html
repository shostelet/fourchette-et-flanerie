    <!--
      Splash screen styles, inline: shown from the very first frame, before
      the app's CSS and JavaScript are downloaded. Removed by src/utils/splash.ts.
    -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #f6f1ea;
        color: #2b2a28;
        font-family: system-ui, sans-serif;
        transition: opacity 250ms ease-out;
      }
      #splash.splash-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #splash svg {
        width: 96px;
        height: 96px;
        filter: drop-shadow(0 8px 16px rgb(74 52 34 / 0.18));
      }
      #splash .splash-title {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      /* The trail's relief breathes gently while loading. */
      #splash .splash-relief {
        animation: splash-breathe 1.6s ease-in-out infinite;
      }
      @keyframes splash-breathe {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .splash-relief { animation: none; }
        #splash { transition: none; }
      }
    </style>
  </head>
