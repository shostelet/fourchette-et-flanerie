[project]
name = "fourchette-api"
version = "0.1.0"
description = "API de Fourchette & Flânerie"
requires-python = ">=3.13"
dependencies = [
  "asyncpg>=0.30",
  "fastapi>=0.115",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fourchette_api"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify, naming, async, bandit
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks things
"tests/**" = ["S101"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
