name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Also allows a manual run from the "Actions" tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push cancels the pending one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Automatic caching would call Yarn before Corepack is enabled.
          package-manager-cache: false

      # Yarn 4, at the exact version pinned in package.json ("packageManager").
      - name: Enable Corepack
        run: |
          npm install -g corepack
          corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Unit tests
        run: yarn test:unit --run

      # Type-check + production build into dist/
      - name: Build
        run: yarn build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
